<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SkiDay</title>
  <meta name="description" content="SkiDay: find a ski resort and check today's conditions. Search 75+ North American resorts (Ikon, Epic and more): new and forecast snow, resort-reported base depth, terrain open and lifts, favorites, map and a transparent ski-day score. Full go / no-go dashboards for A-Basin, Copper and Steamboat." />
  <link rel="canonical" href="https://followthepowder.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SkiDay" />
  <meta property="og:title" content="SkiDay" />
  <meta property="og:description" content="Find your next great ski day. Today's snow, base depth and terrain open for 75+ North American resorts." />
  <meta property="og:url" content="https://followthepowder.com/" />
  <meta name="twitter:card" content="summary" />
  <meta name="theme-color" content="#14283F" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛷️</text></svg>" />
  <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/ski.css?v=326736759e" />
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WQH2HB5M"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <script>document.body.className = 'v-' + (/[?&]resort=/.test(location.search) ? 'dash' : /[?&]plan\b/.test(location.search) ? 'plan' : 'disc');</script>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="./"><span class="logo" aria-hidden="true">⛷️</span><b data-i18n="title">SkiDay</b></a>
      <nav class="tabs" id="nav" aria-label="Sections"></nav>
      <div class="toggles">
        <button id="btn-lang" class="pill" type="button" aria-label="Language">中文</button>
        <button id="btn-units" class="pill" type="button" aria-label="Units">°F</button>
        <button id="btn-refresh" class="pill icon" type="button" aria-label="Refresh" title="Refresh">↻</button>
      </div>
    </div>
  </header>

  <section id="discover" class="disc" aria-label="Find a resort"><div class="disc-hero"><div class="wrap"><div class="skeleton" style="height:180px;margin:24px 0"></div></div></div></section>
  <section id="basic" class="basic"></section>
  <section id="plan" class="plan" aria-label="Plan a Ski Trip"></section>

  <section class="hero-wrap" id="hero">
    <div class="wrap hero-in">
      <a class="dback" id="dash-back" href="./">← <span data-i18n="d_back_all">All resorts</span></a>
      <h1 class="q" id="dash-q">Should we go skiing today?</h1>
      <div id="verdict" aria-live="polite"><div class="skeleton"></div></div>
      <div class="hgrid">
        <div class="vpanel hp" id="mtn-now"></div>
        <details class="vpanel hp getthere"><summary><h2 class="hp-h" id="get-h">Getting there</h2></summary><div id="start" class="start"></div><div id="getthere"></div></details>
      </div>
      <div id="why" class="why"></div>
      <p class="hero-credit" id="hero-credit"></p>
    </div>
  </section>

  <main class="wrap" id="dash-main">
    <section id="mountains" class="block">
      <h2 data-i18n="choose">Choose your mountain</h2>
      <div id="resort-cards" class="rcards"></div>
    </section>

    <section id="intel" class="block card"></section>
    <section id="outlook" class="block card"></section>
    <section id="weather" class="block card"></section>
    <section id="roads" class="block card"></section>
    <section id="wear" class="block card"></section>
    <section id="resorts" class="block card"></section>
    <section id="pack" class="block card"></section>
    <section id="alts" class="block card altsec"></section>

  </main>
  <div class="wrap">
    <footer class="foot">
      <div id="sources" class="sources"></div>
      <p data-i18n="footer"></p>
      <p data-i18n="footer_disc"></p>
      <p class="small" data-i18n="privacy_note"></p>
      <p id="credits" class="small"></p>
    </footer>
  </div>

  <nav class="bnav" id="bnav" aria-label="Sections"></nav>
  <script type="module" src="js/app.js?v=326736759e"></script>
  <script nomodule>document.getElementById('verdict').innerHTML='<p style="padding:16px">This browser is too old for SkiDay. Please update iOS / your browser.</p>';</script>
  <script>
    // Safety net: if the app has not started after 12 s (blocked script, network or a JS error), say so instead of a blank page.
    setTimeout(function () {
      if (window.__skiReady) return;
      var v = document.getElementById(document.body.className.indexOf('v-dash') >= 0 ? 'verdict' : 'discover');
      if (v) v.innerHTML = '<div class="why"><p><b>SkiDay could not finish loading.</b> Check your connection and <a href="" onclick="location.reload(true);return false">tap to reload</a>.</p></div>';
    }, 12000);
  </script>
</body>
</html>
